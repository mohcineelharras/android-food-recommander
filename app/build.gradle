plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def escapeBuildConfig = { String value ->
    return (value ?: '')
        .replace('\\', '\\\\')
        .replace('"', '\\"')
        .replace('\n', '')
        .replace('\r', '')
}

def placesKey = escapeBuildConfig(localProps.getProperty('GOOGLE_PLACES_API_KEY', ''))

android {
    namespace 'com.foodrecommender.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.foodrecommender.app'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
        multiDexEnabled true
        buildConfigField 'String', 'GOOGLE_PLACES_API_KEY', "\"${placesKey}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError true
    }
}

dependencies {
    implementation project(':core')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.insert-koin:koin-android:3.5.6'
}
